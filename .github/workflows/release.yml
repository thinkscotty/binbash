name: Release

# Build cross-platform binaries and publish a GitHub Release automatically
# whenever a version tag (e.g. v1.2.3) is pushed.
on:
  push:
    tags: ["v*"]

# Read-only by default. Permissions set here apply to every job, so a write
# grant at this level would reach the build matrix too; each publishing job
# instead asks for exactly the one write it needs.
permissions:
  contents: read

jobs:
  # Gates everything below: nothing is built, let alone published, from a tag
  # whose checks fail. go-version: stable makes this matter -- a release can be
  # the first thing ever built with a brand-new Go, and this is where a
  # problem with that Go shows up instead of on someone's server.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go vet ./...

      # -race adds about a minute, nearly all of it bcrypt in the auth tests,
      # and catches the data races a concurrent HTTP server is prone to.
      - run: go test -race ./...

      # Fails only on vulnerabilities in code binbash actually calls, so an
      # advisory in an unused corner of a dependency doesn't block a release.
      # @latest rather than a pinned version because an older govulncheck
      # can't load the source of a newer Go, and this job always has the
      # newest Go.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      # Not go-version-file: the go line in go.mod is the oldest Go the code
      # accepts, not the toolchain a release should ship with. Reading it here
      # built every release with that exact patch, long after its security
      # fixes had shipped. "stable" is looked up afresh on every run, so it is
      # always the newest Go release, new minor versions included -- the same
      # Go as golang:1-alpine in the Dockerfile, so release binaries and the
      # image are built alike.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build and package
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="binbash-${VERSION}-${GOOS}-${GOARCH}"
          bin="binbash"
          [ "$GOOS" = "windows" ] && bin="binbash.exe"
          mkdir -p "stage/${name}" dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "stage/${name}/${bin}" .
          cp LICENSE README.md binbash.example.toml "stage/${name}/"
          # The whole deploy directory: the systemd unit plus the fail2ban
          # filter and jail the hardening guide tells people to copy.
          cp -R deploy "stage/${name}/deploy"
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -qr "../dist/${name}.zip" "${name}")
          else
            tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect archives and generate checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          sha256sum $(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%P\n' | sort) > SHA256SUMS.txt
          echo "Checksums:"; cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag like v1.3.0-rc1 must not become GitHub's "latest" release:
          # the in-app updater asks the API for releases/latest, so without
          # this every stable install would be offered the release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Publish container image
    # Not for the artifacts -- this job builds from source itself. It's a gate:
    # if the Go build is broken on any platform, don't publish an image for that
    # tag. A bad :latest is worse than a bad commit, because it's what every
    # `docker compose pull` reaches for.
    needs: build
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one rather than adding to
    # it, so contents: read has to be restated for the checkout.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Automatic, scoped to this repository, and expires with the run. No
          # secret to create or rotate, which is the reason to prefer GHCR over
          # Docker Hub here -- along with no pull rate limits and no account
          # needed to pull a public image.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag v1.2.3 publishes 1.2.3, 1.2 and 1 -- so a compose file can pin
          # as tightly or as loosely as its owner wants -- plus the literal
          # v1.2.3, because that's what the release archives are called and
          # someone copying a version out of the settings page will type the v.
          #
          # latest=auto adds :latest on a semver tag that isn't a pre-release,
          # so pushing v1.3.0-rc1 leaves :latest pointing at the last real one.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.ref_name }}
          flavor: latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Records how the image was built and from which commit, so the
          # published artifact can be traced back to this workflow. It also adds
          # the `unknown/unknown` rows that show up in GHCR's platform list --
          # those are the attestation manifests, not broken images.
          provenance: mode=max
          # No registry or GHA build cache on purpose. Releases are infrequent
          # and this build is a couple of minutes cold, so a cache layer would
          # buy little while adding a way for the release to fail that has
          # nothing to do with binbash.
